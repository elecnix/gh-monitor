name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - name: Run Prettier check
        run: npx --yes prettier --check "*.md" "docs/*.md" "skills/**/*.md"
      - name: Run tests
        run: go test ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=5m

  # Cross-compile check: every target script/build.sh publishes.
  # Keep this list in sync with script/build.sh (source of truth).
  cross-compile:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Cross-compile every published target
        run: |
          set -euo pipefail
          # Keep in sync with script/build.sh (source of truth).
          for pair in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            echo "==> $pair"
            GOOS="${pair%%/*}" GOARCH="${pair##*/}" go build ./...
          done

  # Delta-aware duplicate-code detection (https://deepwiki.com/elecnix/dupdelta):
  # scans the branch and its merge-base, and reports only the duplication this
  # change introduces. It warns inline on the diff; it never fails the build.
  dupdelta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge-base has to be reachable for the delta scan.
          fetch-depth: 0
      - uses: elecnix/dupdelta@0d24393b4589aebdd6ecc101e5668f55f08b6f2b # v0.1.0
        with:
          # actions/checkout does not create a local branch for the base, so
          # compare against the remote-tracking ref fetched by fetch-depth: 0.
          base: origin/main
