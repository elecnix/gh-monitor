name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  test:
    runs-on: arc-runners
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Prettier check
        run: npx --yes prettier --check "*.md" "docs/*.md" "skills/**/*.md"
      - name: Run tests
        run: go test ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # Cross‑compile check: every target script/build.sh publishes.
  # Keep this list in sync with script/build.sh (source of truth).
  cross-compile:
    runs-on: arc-runners
    env:
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        run: GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} go build ./...
