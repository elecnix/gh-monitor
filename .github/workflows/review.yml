name: review
on:
  pull_request_target:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # Only this repository's own branches are reviewed: the job holds the model
    # key. Compare the head repository by name instead of reading its `fork`
    # flag, which is true for a repository that is itself a fork and would
    # then skip every pull request in it (docs/security.md, I1).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@f5707676437aacf2d3566d0e831c5c558717f994 # v0.15.0
        with:
          model_api_key: ${{ secrets.OLLAMA_API_KEY }}
          model_base_url: https://ollama.com/v1
          model_id: deepseek-v4.1-flash
          structured_output: tools
