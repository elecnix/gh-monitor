name: review
on:
  pull_request_target:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # Only this repository's own branches are reviewed: the job holds the model
    # key. Compare the head repository by name instead of reading its `fork`
    # flag, which is true for a repository that is itself a fork and would
    # then skip every pull request in it (docs/security.md, I1).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@534087b12205e442d971bddd7c157354a0c31da1  # v0.14.0
        with:
          require_parameters: true
          model_api_key: ${{ secrets.MODEL_API_KEY }}
          model_base_url: https://openrouter.ai/api/v1
          model_id: deepseek/deepseek-v4-flash-0731
